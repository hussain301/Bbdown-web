<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BBDown Web</title>
  <script>
    // GitHub Pages SPA redirect hack
    // Redirects 404s back to index.html for client-side routing
    const path = window.location.pathname;
    const repo = '/Bbdown-web';
    if (path.startsWith(repo)) {
      const route = path.slice(repo.length);
      sessionStorage.setItem('redirect', route);
      window.location.replace(repo + '/');
    }
  </script>
</head>
<body></body>
</html>
